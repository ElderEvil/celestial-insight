{% extends "base.html" %}

{% block title %}Create Reading - Celestial Insight{% endblock %}

{% block content %}
<h1>Create a Tarot Reading</h1>

<form method="post" action="{% url 'create_reading' %}">
    {% csrf_token %}

    <label for="mentor">Choose a Mentor</label>
    <select id="mentor" name="mentor_id" required>
        <option value="" selected disabled>Select a mentor...</option>
        {% for mentor in mentors %}
        <option value="{{ mentor.id }}">{{ mentor.name }} ({{ mentor.level }})</option>
        {% endfor %}
    </select>

    <label for="question">Your Question</label>
    <textarea id="question" name="question" placeholder="Ask the cards about your future, relationships, career, or spiritual path..." required minlength="5" maxlength="500"></textarea>

    <button type="submit">Draw a Card</button>
</form>

<footer>
    <small>Minimum cost: {{ min_reading_cost }} tokens</small>
</footer>
{% endblock %}
