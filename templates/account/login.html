{% extends "base.html" %}

{% block content %}
<article>
  <h1>Sign In</h1>
  
  {% if form.errors %}
  <div class="pico-background-red-100">
    <p>Your username and password didn't match. Please try again.</p>
  </div>
  {% endif %}

  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    
    <label for="id_login">Email
      <input type="email" name="login" id="id_login" required placeholder="your@email.com">
    </label>
    
    <label for="id_password">Password
      <input type="password" name="password" id="id_password" required>
    </label>
    
    <label for="id_remember">
      <input type="checkbox" name="remember" id="id_remember"> Remember me
    </label>
    
    <button type="submit">Sign In</button>
  </form>
  
  <p>Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
  
  <hr>
  <p>Or sign in with:</p>
  <nav aria-label="Social login">
    <ul>
      <li><a href="{% url 'socialaccount_login' 'google' %}">Google</a></li>
      <li><a href="{% url 'socialaccount_login' 'github' %}">GitHub</a></li>
    </ul>
  </nav>
  
  {% include "socialaccount/snippets.html" %}
</article>
{% endblock %}
