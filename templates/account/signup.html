{% extends "base.html" %}

{% block content %}
<article>
  <h1>Sign Up</h1>
  
  <p>Already have an account? <a href="{% url 'account_login' %}">Sign in</a></p>

  <form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    
    <label for="id_email">Email
      <input type="email" name="email" id="id_email" required placeholder="your@email.com">
    </label>
    
    <button type="submit">Sign Up</button>
  </form>
  
  <hr>
  <p>Or sign up with:</p>
  <nav aria-label="Social signup">
    <ul>
      <li><a href="{% url 'socialaccount_signup' 'google' %}">Google</a></li>
      <li><a href="{% url 'socialaccount_signup' 'github' %}">GitHub</a></li>
    </ul>
  </nav>
  
  {% include "socialaccount/snippets.html" %}
</article>
{% endblock %}
