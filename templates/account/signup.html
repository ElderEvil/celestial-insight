{% extends "base.html" %}

{% block content %}
<article>
  <h1>Sign Up</h1>
  
  <p>Already have an account? <a href="{% url 'account_login' %}">Sign in</a></p>

  <form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    
    <label for="id_email">Email
      <input type="email" name="email" id="id_email" required placeholder="your@email.com">
    </label>
    
    <button type="submit">Sign Up</button>
  </form>
</article>
{% endblock %}
